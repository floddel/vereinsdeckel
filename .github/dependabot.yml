# Hält die festgelegten Bausteine der GitHub-Abläufe und das Docker-Basisabbild aktuell
# (Vorschläge als Pull Request).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Bei Node 24 (Langzeitversion) bleiben – keine Sprünge auf neue Hauptversionen
      - dependency-name: node
        update-types: ["version-update:semver-major"]
