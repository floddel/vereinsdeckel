# Neue Version (Tag v1.2.3): Docker-Abbild für PC/Server (amd64) und Raspberry Pi (arm64) bauen,
# kurz starten und prüfen, dann als ghcr.io/floddel/vereinsdeckel veröffentlichen.
name: Docker

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/floddel/vereinsdeckel

jobs:
  docker:
    if: github.repository == 'floddel/vereinsdeckel'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Bauen (zum Prüfen)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: vereinsdeckel:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Starten und prüfen
        run: |
          mkdir -p daten && chmod 777 daten
          docker run -d --name vd -p 3000:3000 -v "$PWD/daten:/data" vereinsdeckel:test
          for i in $(seq 1 60); do curl -fs http://localhost:3000/api/health && break; sleep 2; done
          curl -fs http://localhost:3000/api/health | grep -q '"ok":true'
          docker logs vd 2>&1 | grep -q "Einrichtungs-Code für /einrichten"
          test -s daten/.auth-secret
          curl -fs http://localhost:3000/einrichten | grep -q "Einrichtungs-Code"
          curl -fs -o /dev/null http://localhost:3000/karte
          echo "Abbild startet, Datenbank und Einrichtung bereit."
      - name: Protokoll bei Fehler
        if: failure()
        run: docker logs vd || true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
      - name: Veröffentlichen (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
